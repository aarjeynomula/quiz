<!DOCTYPE html>
<html>
<head>
  <title>Voice Quiz App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; max-width: 700px; margin: 15px auto; padding: 12px; background: #f4f7fb; }
    h1 { color: #1a4d8f; font-size: 22px; }
    textarea { width: 100%; height: 100px; font-size: 14px; padding: 8px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; }
    button { padding: 14px 18px; font-size: 16px; margin: 4px 2px; cursor: pointer; border: none; border-radius: 8px; background: #1a4d8f; color: white; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #submitBtn { background: #16a34a; font-size: 18px; padding: 16px 24px; }
    #question { font-size: 20px; font-weight: bold; margin: 15px 0; padding: 15px; background: white; border-radius: 8px; border-left: 5px solid #1a4d8f; }
    #feedback { font-size: 18px; margin: 12px 0; font-weight: bold; min-height: 24px; }
    .correct { color: green; }
    .wrong { color: red; }
    #answerInput { width: 100%; font-size: 20px; padding: 16px; box-sizing: border-box; border: 3px solid #1a4d8f; border-radius: 8px; margin: 10px 0; background: #fffbe6; }
    #score { font-size: 16px; margin-top: 12px; color: #1a4d8f; font-weight: bold; }
    #status { font-size: 16px; color: #d97706; font-weight: bold; margin: 10px 0; }
    hr { margin: 20px 0; }
    .instruction { font-size: 15px; color: #333; background: #e0f2fe; padding: 12px; border-radius: 8px; margin: 12px 0; border-left: 4px solid #0284c7; }
    .step { margin: 6px 0; }
  </style>
</head>
<body>
  <h1>🎤 Voice Quiz App</h1>

  <h3>Enter Questions & Answers</h3>
  <p style="font-size:13px;color:#666;">One per line: <code>question | answer</code></p>
  <textarea id="input">What is 2 plus 2? | 4
What is the capital of France? | Paris
What color is the sky? | blue
What is 5 plus 3? | 8</textarea>
  <br>
  <button onclick="loadQuiz()">Load Quiz</button>
  <button onclick="speakQuestion()" id="speakBtn" disabled>🔊 Ask Question</button>

  <hr>

  <div id="question">Click "Load Quiz" to start</div>

  <div class="instruction">
    <b>How to answer:</b>
    <div class="step">1. Tap the yellow box below 👇</div>
    <div class="step">2. Tap the 🎤 mic on your keyboard</div>
    <div class="step">3. Say your answer clearly</div>
    <div class="step">4. Tap <b>Check Answer</b></div>
  </div>

  <input type="text" id="answerInput" placeholder="Tap here, then tap keyboard mic 🎤" disabled autocomplete="off">

  <button id="submitBtn" onclick="submitAnswer()" disabled>✅ Check Answer</button>
  <button id="nextBtn" onclick="nextQuestion()" disabled style="display:none;">➡️ Next</button>

  <div id="status"></div>
  <div id="feedback"></div>
  <div id="score"></div>

<script>
let quiz = [];
let current = 0;
let correctCount = 0;

function loadQuiz() {
  const lines = document.getElementById('input').value.trim().split('\n');
  quiz = lines.map(line => {
    const parts = line.split('|');
    return { question: parts[0].trim(), answer: parts[1] ? parts[1].trim() : '' };
  }).filter(x => x.question && x.answer);
  current = 0;
  correctCount = 0;
  showQuestion();
}

function showQuestion() {
  if (current >= quiz.length) {
    document.getElementById('question').textContent = "🎉 Quiz finished!";
    document.getElementById('score').textContent = `Final Score: ${correctCount} / ${quiz.length}`;
    document.getElementById('answerInput').disabled = true;
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('nextBtn').style.display = 'none';
    return;
  }
  document.getElementById('question').textContent = `Q${current+1}: ${quiz[current].question}`;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = '';
  document.getElementById('answerInput').value = '';
  document.getElementById('answerInput').disabled = false;
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('status').textContent = '';
  document.getElementById('score').textContent = `Score: ${correctCount} / ${quiz.length}`;
  document.getElementById('speakBtn').disabled = false;
  speakQuestion();
}

function speakQuestion() {
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(quiz[current].question);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  speechSynthesis.speak(utter);
}

function submitAnswer() {
  const spoken = document.getElementById('answerInput').value.toLowerCase().trim();
  if (!spoken) {
    document.getElementById('status').textContent = "⚠️ Please speak or type an answer first.";
    return;
  }
  checkAnswer(spoken);
}

function checkAnswer(spoken) {
  const correct = quiz[current].answer.toLowerCase().trim();
  const feedback = document.getElementById('feedback');

  if (spoken.includes(correct) || correct.includes(spoken)) {
    feedback.textContent = "✅ Correct!";
    feedback.className = "correct";
    correctCount++;
    speechSynthesis.speak(new SpeechSynthesisUtterance("Correct!"));
  } else {
    feedback.textContent = `❌ Wrong. Answer: ${quiz[current].answer}`;
    feedback.className = "wrong";
    speechSynthesis.speak(new SpeechSynthesisUtterance(`Wrong. The answer is ${quiz[current].answer}`));
  }
  document.getElementById('nextBtn').style.display = 'inline-block';
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('answerInput').disabled = true;
  document.getElementById('status').textContent = '';
  document.getElementById('score').textContent = `Score: ${correctCount} / ${quiz.length}`;
}

function nextQuestion() {
  current++;
  showQuestion();
}
</script>
</body>
</html>
