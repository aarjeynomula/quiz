<!DOCTYPE html>
<html>
<head>
  <title>AI Voice Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; max-width: 700px; margin: 15px auto; padding: 12px; background: #f4f7fb; }
    h1 { color: #1a4d8f; font-size: 22px; }
    textarea { width: 100%; height: 140px; font-size: 14px; padding: 8px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; }
    button { padding: 14px 18px; font-size: 16px; margin: 4px 2px; cursor: pointer; border: none; border-radius: 8px; background: #1a4d8f; color: white; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #submitBtn { background: #16a34a; font-size: 18px; padding: 16px 24px; }
    #question { font-size: 19px; font-weight: bold; margin: 15px 0; padding: 15px; background: white; border-radius: 8px; border-left: 5px solid #1a4d8f; }
    #feedback { font-size: 17px; margin: 12px 0; min-height: 24px; padding: 12px; border-radius: 8px; line-height: 1.5; }
    .correct { color: #15803d; background: #dcfce7; border-left: 5px solid #16a34a; }
    .wrong { color: #991b1b; background: #fee2e2; border-left: 5px solid #dc2626; }
    .checking { color: #92400e; background: #fef3c7; border-left: 5px solid #f59e0b; }
    #answerInput { width: 100%; font-size: 17px; padding: 16px; box-sizing: border-box; border: 3px solid #1a4d8f; border-radius: 8px; margin: 10px 0; background: #fffbe6; }
    #score { font-size: 16px; margin-top: 12px; color: #1a4d8f; font-weight: bold; }
    #status { font-size: 15px; color: #d97706; font-weight: bold; margin: 10px 0; }
    hr { margin: 20px 0; }
    .instruction { font-size: 14px; color: #333; background: #e0f2fe; padding: 12px; border-radius: 8px; margin: 12px 0; border-left: 4px solid #0284c7; }
    .step { margin: 4px 0; }
  </style>
</head>
<body>
  <h1>🤖 AI Voice Quiz</h1>

  <h3>Questions & Answers</h3>
  <p style="font-size:13px;color:#666;">One per line: <code>question | answer</code> — long answers OK now!</p>
  <textarea id="input">What event does Dr. Kurien refer to? | Dr. Kurien refers to the award ceremony in Delhi in 1999, when the President of India conferred the Padma Vibhushan on him.
How did joining the cooperative affect Dr. Kurien's life? | It transformed his life. It became meaningful service to farmers and shaped his contribution to India's dairy revolution.
What is 2 plus 2? | 4</textarea>
  <br>
  <button onclick="loadQuiz()">Load Quiz</button>
  <button onclick="speakQuestion()" id="speakBtn" disabled>🔊 Ask Question</button>

  <hr>

  <div id="question">Click "Load Quiz" to start</div>

  <div class="instruction">
    <b>How to answer:</b>
    <div class="step">1. Tap the yellow box below 👇</div>
    <div class="step">2. Tap the 🎤 mic on your keyboard</div>
    <div class="step">3. Say your answer</div>
    <div class="step">4. Tap <b>Check Answer</b></div>
  </div>

  <input type="text" id="answerInput" placeholder="Tap here, then tap keyboard mic 🎤" disabled autocomplete="off">

  <button id="submitBtn" onclick="submitAnswer()" disabled>✅ Check Answer</button>
  <button id="nextBtn" onclick="nextQuestion()" disabled>➡️ Next</button>

  <div id="status"></div>
  <div id="feedback"></div>
  <div id="score"></div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx6UXqvMDS7IoO2E7NOHGKkpZs801L3g57Ak3xo6fmD-sRZi7CkHep4yOi3tcH_UtmUag/exec";

let quiz = [];
let current = 0;
let correctCount = 0;

function loadQuiz() {
  const lines = document.getElementById('input').value.trim().split('\n');
  quiz = lines.map(line => {
    const idx = line.indexOf('|');
    if (idx === -1) return null;
    return { question: line.slice(0, idx).trim(), answer: line.slice(idx + 1).trim() };
  }).filter(x => x && x.question && x.answer);
  current = 0;
  correctCount = 0;
  showQuestion();
}

function showQuestion() {
  if (current >= quiz.length) {
    document.getElementById('question').textContent = "🎉 Quiz finished!";
    document.getElementById('score').textContent = `Final Score: ${correctCount} / ${quiz.length}`;
    document.getElementById('answerInput').disabled = true;
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    return;
  }
  document.getElementById('question').textContent = `Q${current+1}: ${quiz[current].question}`;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = '';
  document.getElementById('answerInput').value = '';
  document.getElementById('answerInput').disabled = false;
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('status').textContent = '';
  document.getElementById('score').textContent = `Score: ${correctCount} / ${quiz.length}`;
  document.getElementById('speakBtn').disabled = false;
  speakQuestion();
}

function speakQuestion() {
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(quiz[current].question);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  speechSynthesis.speak(utter);
}

async function submitAnswer() {
  const spoken = document.getElementById('answerInput').value.trim();
  if (!spoken) {
    document.getElementById('status').textContent = "⚠️ Please speak or type an answer first.";
    return;
  }
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('status').textContent = "🤔 AI is checking your answer...";
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'checking';

  try {
    const result = await askAI(quiz[current].question, quiz[current].answer, spoken);
    showResult(result, spoken);
  } catch (err) {
    document.getElementById('status').textContent = '';
    document.getElementById('feedback').textContent = "⚠️ Error: " + err.message;
    document.getElementById('feedback').className = 'wrong';
    document.getElementById('submitBtn').disabled = false;
  }
}

async function askAI(question, correctAnswer, studentAnswer) {
  const prompt = `You are helping a school student practice at home.

Question: ${question}
Correct answer: ${correctAnswer}
Student's spoken answer: ${studentAnswer}

Task: Decide if the student's answer is correct.
- If the student's answer has the same meaning as the correct answer (even if worded differently), it is CORRECT.
- If the student's answer is missing the main point, it is WRONG.
- Ignore small spelling or speech recognition mistakes.

Reply in exactly this format:
VERDICT: CORRECT
REPLY: (one short, kind sentence for the student)`;

const response = await fetch(APPS_SCRIPT_URL, {
  method: 'POST',
  headers: { 'Content-Type': 'text/plain' },
  body: JSON.stringify({ prompt: prompt })
});

  if (!response.ok) {
    const t = await response.text();
    throw new Error("AI error " + response.status + ": " + t.slice(0, 200));
  }

  const data = await response.json();
  const text = data.text || "";
  const verdict = text.match(/VERDICT:\s*(CORRECT|WRONG)/i);
  const reply = text.match(/REPLY:\s*(.+)/i);

  return {
    correct: verdict ? verdict[1].toUpperCase() === 'CORRECT' : false,
    message: reply ? reply[1].trim() : text.trim()
  };
}

function showResult(result, spoken) {
  const feedback = document.getElementById('feedback');
  document.getElementById('status').textContent = '';

  if (result.correct) {
    feedback.textContent = "✅ " + result.message;
    feedback.className = 'correct';
    correctCount++;
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance("Correct! " + result.message));
  } else {
    feedback.textContent = "❌ " + result.message + "\n\nCorrect answer: " + quiz[current].answer;
    feedback.className = 'wrong';
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance("Not correct. " + result.message));
  }

  document.getElementById('nextBtn').disabled = false;
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('answerInput').disabled = true;
  document.getElementById('score').textContent = `Score: ${correctCount} / ${quiz.length}`;
}

function nextQuestion() {
  current++;
  showQuestion();
}
</script>
</body>
</html>
