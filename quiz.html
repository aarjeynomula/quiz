<!DOCTYPE html>
<html>
<head>
  <title>Voice Quiz App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; max-width: 700px; margin: 15px auto; padding: 12px; background: #f4f7fb; }
    h1 { color: #1a4d8f; font-size: 22px; }
    textarea { width: 100%; height: 100px; font-size: 14px; padding: 8px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; }
    button { padding: 14px 18px; font-size: 16px; margin: 4px 2px; cursor: pointer; border: none; border-radius: 8px; background: #1a4d8f; color: white; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #question { font-size: 20px; font-weight: bold; margin: 15px 0; padding: 15px; background: white; border-radius: 8px; border-left: 5px solid #1a4d8f; }
    #feedback { font-size: 18px; margin: 12px 0; font-weight: bold; min-height: 24px; }
    .correct { color: green; }
    .wrong { color: red; }
    #transcript { font-size: 16px; color: #333; margin: 8px 0; min-height: 22px; padding: 8px; background: #fffbe6; border-radius: 6px; }
    #score { font-size: 16px; margin-top: 12px; color: #1a4d8f; font-weight: bold; }
    #status { font-size: 18px; color: #d97706; font-weight: bold; margin: 10px 0; min-height: 26px; }
    #debug { font-size: 12px; color: #888; margin-top: 10px; padding: 6px; background: #f0f0f0; border-radius: 4px; white-space: pre-wrap; }
    hr { margin: 20px 0; }
  </style>
</head>
<body>
  <h1>🎤 Voice Quiz App</h1>

  <h3>Enter Questions & Answers</h3>
  <p style="font-size:13px;color:#666;">One per line: <code>question | answer</code></p>
  <textarea id="input">What is 2 plus 2? | 4
What is the capital of France? | Paris
What color is the sky? | blue
What is 5 plus 3? | 8</textarea>
  <br>
  <button onclick="loadQuiz()">Load Quiz</button>
  <button onclick="speakQuestion()" id="speakBtn" disabled>🔊 Ask Question</button>

  <hr>

  <div id="question">Click "Load Quiz" to start</div>

  <button id="listenBtn" onclick="listenAnswer()" disabled>🎤 Answer Now</button>
  <button id="nextBtn" onclick="nextQuestion()" disabled>➡️ Next</button>

  <div id="status"></div>
  <div id="transcript">Words will appear here...</div>
  <div id="feedback"></div>
  <div id="score"></div>
  <div id="debug">Debug: waiting...</div>

<script>
let quiz = [];
let current = 0;
let correctCount = 0;
let recognition = null;
let debugLog = [];

function log(msg) {
  debugLog.push(new Date().toLocaleTimeString() + " " + msg);
  document.getElementById('debug').textContent = "Debug:\n" + debugLog.slice(-8).join("\n");
}

function loadQuiz() {
  const lines = document.getElementById('input').value.trim().split('\n');
  quiz = lines.map(line => {
    const parts = line.split('|');
    return { question: parts[0].trim(), answer: parts[1] ? parts[1].trim() : '' };
  }).filter(x => x.question && x.answer);
  current = 0;
  correctCount = 0;
  debugLog = [];
  showQuestion();
}

function showQuestion() {
  if (current >= quiz.length) {
    document.getElementById('question').textContent = "🎉 Quiz finished!";
    document.getElementById('score').textContent = `Final Score: ${correctCount} / ${quiz.length}`;
    document.getElementById('listenBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    return;
  }
  document.getElementById('question').textContent = `Q${current+1}: ${quiz[current].question}`;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = '';
  document.getElementById('transcript').textContent = 'Words will appear here...';
  document.getElementById('status').textContent = '';
  document.getElementById('score').textContent = `Score: ${correctCount} / ${quiz.length}`;
  document.getElementById('speakBtn').disabled = false;
  document.getElementById('listenBtn').disabled = false;
  document.getElementById('nextBtn').disabled = true;
  speakQuestion();
}

function speakQuestion() {
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(quiz[current].question);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  speechSynthesis.speak(utter);
}

function listenAnswer() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert("Speech recognition not supported. Use Chrome.");
    return;
  }

  if (recognition) { try { recognition.abort(); } catch(e) {} }

  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.maxAlternatives = 1;

  document.getElementById('transcript').textContent = 'Speak now...';
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = '';
  document.getElementById('status').textContent = '🎧 Listening... speak your answer';
  document.getElementById('listenBtn').disabled = true;
  document.getElementById('nextBtn').disabled = true;

  recognition.onstart = () => log("onstart");
  recognition.onaudiostart = () => log("onaudiostart");
  recognition.onspeechstart = () => {
    log("onspeechstart");
    document.getElementById('transcript').textContent = '👂 Hearing you...';
  };
  recognition.onspeechend = () => log("onspeechend");
  recognition.onaudioend = () => log("onaudioend");

  recognition.onresult = (event) => {
    const spoken = event.results[0][0].transcript;
    log("RESULT: " + spoken);
    document.getElementById('transcript').textContent = `Heard: "${spoken}"`;
    checkAnswer(spoken.toLowerCase().trim());
  };

  recognition.onerror = (e) => {
    log("ERROR: " + e.error);
    if (e.error === "no-speech") {
      document.getElementById('status').textContent = "❌ No speech heard. Try again.";
    } else if (e.error === "not-allowed") {
      document.getElementById('status').textContent = "❌ Mic blocked.";
    } else if (e.error === "aborted") {
      return;
    } else {
      document.getElementById('status').textContent = "❌ " + e.error;
    }
    document.getElementById('listenBtn').disabled = false;
  };

  recognition.onend = () => {
    log("onend");
    document.getElementById('status').textContent = '';
    if (!document.getElementById('feedback').textContent) {
      document.getElementById('listenBtn').disabled = false;
    }
  };

  try {
    recognition.start();
    log("start() called");
  } catch(e) {
    log("start error: " + e.message);
  }
}

function checkAnswer(spoken) {
  const correct = quiz[current].answer.toLowerCase().trim();
  const feedback = document.getElementById('feedback');

  if (spoken.includes(correct) || correct.includes(spoken)) {
    feedback.textContent = "✅ Correct!";
    feedback.className = "correct";
    correctCount++;
    speechSynthesis.speak(new SpeechSynthesisUtterance("Correct!"));
  } else {
    feedback.textContent = `❌ Wrong. Answer: ${quiz[current].answer}`;
    feedback.className = "wrong";
    speechSynthesis.speak(new SpeechSynthesisUtterance(`Wrong. The answer is ${quiz[current].answer}`));
  }
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('listenBtn').disabled = true;
  document.getElementById('score').textContent = `Score: ${correctCount} / ${quiz.length}`;
}

function nextQuestion() {
  current++;
  showQuestion();
}
</script>
</body>
</html>
